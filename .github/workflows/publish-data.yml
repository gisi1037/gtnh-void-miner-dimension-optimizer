name: Publish verified bundled data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-data.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source snapshot
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          from pathlib import Path
          encoded = ''''''
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(data) == 34800
          assert hashlib.sha256(data).hexdigest() == '1ef313c9cc13ea7c18e301b1f474ebc2fcd5728fc16867eea08fa1880572d9d6'
          target = Path('vmweights.csv')
          if target.exists() and target.read_bytes() != data:
              raise RuntimeError('Refusing to replace a different ore snapshot')
          target.write_bytes(data)
          print('Verified original CSV snapshot: 34,800 bytes')
          PY
      - name: Generate complete example reports
        run: python ore_dimension_optimizer.py --max-tier all --all-solutions --report-prefix results
      - name: Run all tests and verify report hashes
        run: |
          python -m unittest discover -v
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'results.json': '34f0a1ac920ec1a04bc90e947842ab65c3bbb85a2b54415914ff1184660d11c9',
              'results_coverage.csv': '4a0f53b50209391c9a8686f3dece20d2e53e516ab0fdc45c5d25af558b4989b3',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
              print('Verified:', name)
          PY
      - name: Commit verified data and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vmweights.csv results.json results_coverage.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified ore snapshot and all optimal coverage reports'
            git push origin HEAD:main
          fi
